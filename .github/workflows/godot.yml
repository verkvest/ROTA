name: "Godot Engine"
on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - released

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: kivven-ci

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot Engine downloads
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            export/godot
            export/export-templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot Engine from GitHub release
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p export && cd export
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates export-templates

      - name: Install export templates
        run: |
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -a export/export-templates/. "$DEST/"

      - name: Export PCK file
        run: |
          export/godot --headless --path=. --export-pack "Linux" "export/${EXPORT_NAME}.pck"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}
          path: export/${{ env.EXPORT_NAME }}.pck

  screenshots:
    name: Phone screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libxcursor1 libxi6 libxrandr2 libxinerama1
      - name: Godot
        run: |
          mkdir -p export
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d export
          mv export/Godot_v${GODOT_VERSION}-stable_linux.x86_64 export/godot
          chmod +x export/godot
      - name: Capture menu and gameplay
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xvfb-run -s "-screen 0 1280x720x24" export/godot --path . --resolution 1280x720 -- --phone-shot --shot-dir="$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: ${{ runner.temp }}/shots/*.png

  release:
    name: Release
    needs: export
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mv '${{ env.EXPORT_NAME }}.pck' '${{ env.EXPORT_NAME }}-${{ github.ref_name }}.pck'
          gh release upload '${{ github.ref_name }}' '${{ env.EXPORT_NAME }}-${{ github.ref_name }}.pck' --repo '${{ github.repository }}'
