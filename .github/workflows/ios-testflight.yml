# Build Kivven with Godot, sign with automatic cloud signing, upload to TestFlight.
# The App Store Connect app record cannot be created via the API used here.
# If upload fails only because that record does not exist, the log says so and the run stops.
name: ios-testflight

on:
  workflow_dispatch:
  pull_request:

env:
  TEAM_ID: 38PT254HDZ
  BUNDLE_ID: es.verkvest.kivven
  APP_VERSION: "0.1.0"
  GODOT_VERSION: 4.7.2

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::App Store Connect API key secrets are not set – skipping signing and upload."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - name: Xcode 26
        if: env.HAS_KEY == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Register bundle id
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          keyfile = os.environ["KEYFILE"]
          kid = os.environ["APPSTORE_API_KEY_ID"]
          iss = os.environ["APPSTORE_API_ISSUER_ID"]
          bundle = os.environ["BUNDLE_ID"]

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def der_to_raw(der: bytes) -> bytes:
              # ECDSA DER sequence of two integers -> 32-byte R || 32-byte S
              if der[0] != 0x30:
                  raise SystemExit("API key signature was not DER")
              i = 2
              def read_int(buf, idx):
                  if buf[idx] != 0x02:
                      raise SystemExit("bad DER integer")
                  ln = buf[idx + 1]
                  idx += 2
                  val = buf[idx:idx + ln]
                  idx += ln
                  return val, idx
              r, i = read_int(der, i)
              s, i = read_int(der, i)
              return r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")

          now = int(time.time())
          header = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64(json.dumps({
              "iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"
          }, separators=(",", ":")).encode())
          signing = f"{header}.{payload}".encode()
          der = subprocess.check_output(["openssl", "dgst", "-sha256", "-sign", keyfile], input=signing)
          token = f"{header}.{payload}.{b64(der_to_raw(der))}"
          body = json.dumps({
              "data": {
                  "type": "bundleIds",
                  "attributes": {
                      "identifier": bundle,
                      "name": "Kivven",
                      "platform": "IOS",
                  },
              }
          }).encode()
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("registered", bundle, resp.status)
          except urllib.error.HTTPError as err:
              detail = err.read().decode("utf-8", "replace")
              if err.code == 409 or "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" in detail or "already exists" in detail.lower():
                  print("bundle id already registered:", bundle)
              else:
                  print(detail)
                  raise
          PY

      - name: Godot iOS export
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP/godot"
          xattr -cr "$RUNNER_TEMP/godot/Godot.app" || true
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$DEST/"
          sed -i '' "s/^application\\/version=\"1\"/application\\/version=\"${{ github.run_number }}\"/" export_presets.cfg
          mkdir -p "$RUNNER_TEMP/ios"
          "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" --headless --path . --export-release "iOS" "$RUNNER_TEMP/ios/Kivven"
          find "$RUNNER_TEMP/ios" -maxdepth 3 -type d -o -name '*.xcodeproj' | head -40

      - name: Encryption flag and unsigned archive
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROJ=$(find "$RUNNER_TEMP/ios" -name '*.xcodeproj' | head -1)
          [ -n "$PROJ" ] || { echo "::error::Godot did not produce an Xcode project"; exit 1; }
          echo "PROJECT=$PROJ"
          while IFS= read -r plist; do
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist"
          done < <(find "$RUNNER_TEMP/ios" -name Info.plist)
          SCHEME=$(xcodebuild -project "$PROJ" -list | awk '/Schemes:/{p=1; next} p && NF {print $1; exit}')
          echo "SCHEME=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kivven.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            SKIP_INSTALL=NO INSTALL_PATH=/Applications \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -80
          test ${PIPESTATUS[0]} -eq 0
          find "$RUNNER_TEMP/Kivven.xcarchive" -maxdepth 3 | head -30

      - name: Export with App Store distribution signing and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kivven.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          if grep -q "ERROR" "$RUNNER_TEMP/upload.log"; then
            if grep -q "Cannot determine the Apple ID" "$RUNNER_TEMP/upload.log"; then
              echo "::error::No App Store Connect app record for $BUNDLE_ID yet. Create it in App Store Connect (Apps → +) for team $TEAM_ID, then re-run this workflow. The bundle id itself is registered by this job when it is missing. This missing app record is the expected stop; nothing else in the export is being treated as that failure."
            fi
            exit 1
          fi
          echo "::notice::Uploaded $BUNDLE_ID $APP_VERSION (${{ github.run_number }}) to App Store Connect"

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_KEY == 'true'
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore

      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
